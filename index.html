    <section id="torzs" class="section offset-header">

        <!-- HOME BOX -->

        <div class="home-box custom-box">
          <h3>Kvízkérdések</h3>
          <div class="picture">
            <img class="caption" src="img/jeshoots-com--2vD8lIhdnw-unsplash.jpg" alt="quizábra" />

          <button id="startDailyQuiz" class="btn" type="button">Napi kvíz</button>
		  
		  <button id="startSort" class="btn" type="button">Sorkérdések</button>
       
        </div>

        <!-- QUIZ BOX -->

        <div class="quiz-box custom-box hide">
          <div class="question-number"></div>
          <div class="question-text"></div>
          <div class="question-block hide">
            <pre><code class="qbl-data"></code></pre>
            <pre><code class="info-text"></code></pre>
          </div>
          <div class="option-container"></div>
		  
          <div class="next-question-btn">
            <button id="next" class="btn" type="button">Következő</button>
          </div>
          <div class="answers-indicator">
            <div></div>
          </div>
        </div>

        <!-- RESULT BOX -->

        <div class="result-box custom-box hide">
          <h1>Eredmény</h1>
          <table>
            <tr>
              <td>Összes kérdés:</td>
              <td><span class="total-question"></span></td>
            </tr>
            <tr>
              <td>Megválaszolt kérdések:</td>
              <td><span class="total-attempt"></span></td>
            </tr>
            <tr>
              <td>Helyes válaszok száma:</td>
              <td><span class="total-correct"></span></td>
            </tr>
            <tr>
              <td>Hibás válaszok száma:</td>
              <td><span class="total-wrong"></span></td>
            </tr>
            <tr>
              <td>Százalékos eredmény:</td>
              <td><span class="percentage"></span></td>
            </tr>
            <tr>
              <td>Összesített pontszám:</td>

            </tr>
          </table>
